<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#54172A">
  <title>LocalBoost - temporary preview</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <style>
    html,body{margin:0;height:100%;background:#260B18;font-family:system-ui,sans-serif}
    iframe{border:0;width:100%;height:100%;display:block;background:#fff}
    .msg{color:#FFF9EF;padding:40px 24px;max-width:560px;margin:0 auto;line-height:1.5}
    .msg a{color:#F8D66A}
  </style>
</head>
<body>
  <script type="module">
    // Public temporary preview: the whole site config travels in the URL hash (never sent to a server),
    // is re-validated by normalizeDoc() and rendered inside a sandboxed iframe.
    import { normalizeDoc, buildDocument } from '/js/siteTemplate.js';
    const msg = (t) => { document.body.innerHTML = '<div class="msg"></div>'; document.querySelector('.msg').innerHTML = t; };
    try {
      const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
      if (!m) throw new Error('empty');
      const json = decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))));
      const doc = normalizeDoc(JSON.parse(json));
      document.documentElement.lang = doc.lang;
      document.title = doc.text.brand + ' - ' + doc.text.tempLabel;
      if (doc.exp && Date.now() > doc.exp) {
        msg('<h1>Temporary preview expired</h1><p>This LocalBoost demo link is no longer active. Ask the owner to share a new one.</p>');
      } else {
        const f = document.createElement('iframe');
        f.setAttribute('sandbox', 'allow-scripts allow-forms');
        f.title = doc.text.brand;
        f.srcdoc = buildDocument(doc, { temp: true });
        document.body.appendChild(f);
      }
    } catch (e) {
      msg('<h1>Preview unavailable</h1><p>This temporary link is missing or damaged. Open LocalBoost and use <strong>Share</strong> again.</p><p><a href="/">LocalBoost</a></p>');
    }
  </script>
</body>
</html>
