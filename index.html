<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LocalBoost</title>
  <meta name="description" content="LocalBoost - Signal-to-Action OS for local businesses. Observe, diagnose, act, measure.">
  <meta name="theme-color" content="#54172A">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LocalBoost">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Archivo:wdth,wght@112,600;112,700;112,800&display=swap">
  <style>
    /* opening screen: inline so it paints before anything else loads */
    #splash{position:fixed;inset:0;z-index:1000;background:#7E041D;color:#FFF3C4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:Lexend,system-ui,sans-serif;transition:opacity .35s ease,visibility .35s}
    #splash.gone{opacity:0;visibility:hidden}
    #splash img{width:112px;height:112px;border-radius:26px;animation:spl-in .7s cubic-bezier(.2,.8,.2,1) both}
    #splash strong{font-size:1.7rem;font-weight:500;letter-spacing:-.02em;animation:spl-up .6s .2s both}
    #splash span{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75;animation:spl-up .6s .3s both}
    #splash i{display:block;width:120px;height:3px;border-radius:3px;background:rgba(255,243,196,.25);margin-top:22px;overflow:hidden;position:relative}
    #splash i::after{content:"";position:absolute;inset:0;width:40%;background:#FFE08A;border-radius:3px;animation:spl-bar 1.1s ease-in-out infinite}
    @keyframes spl-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
    @keyframes spl-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes spl-bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
  </style>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/ledger.css">
  <script>
    // set the saved theme before first paint (no flash)
    try { var m = localStorage.getItem('localboost.theme'); if (m) document.documentElement.dataset.theme = m; else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" role="presentation">
    <img src="/icons/logo.png" alt="" width="112" height="112">
    <strong>LocalBoost</strong>
    <span>Signal-to-Action OS</span>
    <i></i>
  </div>
  <div id="app" class="app"></div>
  <div id="update-bar" class="update-bar" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root" hidden></div>
  <div id="present-root" hidden></div>
  <div id="pitch-root" hidden></div>
  <div id="chat-root" hidden></div>
  <noscript><p style="padding:24px;font-family:sans-serif">LocalBoost needs JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
