<head>
  <meta charset="utf-8">

  <meta property="og:site_name" content="Arcton Ai">
  <meta property="og:title" content="Arcton Ai · Află ce te costă clienți. Lansare 30.11.2026">
  <meta property="og:description" content="Citim fiecare recenzie Google a afacerii tale, te comparăm cu concurența și îți spunem ce să repari săptămâna asta. Plus site cu rezervări și materiale gata de folosit.">
  <meta property="og:url" content="https://www.arcton.site/">
  <meta property="og:image" content="https://www.arcton.site/icons/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.json">

  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Arcton Ai">
  <link rel="stylesheet" href="/fonts/g/app.css"><!-- self-hosted copies of Google Fonts: visitors' IPs never go to Google -->
  <style>
    /* opening screen (Bordo): inline so it paints before anything else loads. The trail climbs the mountain while the app starts. */
    @font-face{font-family:'Archivo';font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url('/fonts/archivo-latin.woff2') format('woff2')}
    #splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(60% 55% at 50% 42%,#2A0B12 0%,#0C0A0A 70%);color:#EDE6DC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Archivo,system-ui,sans-serif;transition:opacity .45s ease,visibility .45s}
    #splash.gone{opacity:0;visibility:hidden}
    #splash svg{width:180px;height:auto;overflow:visible}
    #splash .m{fill:#2A2220;stroke:#C9A27A;stroke-opacity:.45;stroke-width:1.2;animation:spl-up .9s cubic-bezier(.16,1,.3,1) both}
    #splash .t{fill:none;stroke:#C2384E;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spl-climb 1.6s .2s cubic-bezier(.16,1,.3,1) infinite}
    #splash .p{fill:#8E1B2C;stroke:#EDE6DC;stroke-width:1.2;animation:spl-up .6s .5s both}
    #splash strong{font-weight:600;font-stretch:125%;font-size:.8rem;letter-spacing:.34em;text-transform:uppercase;margin-top:10px;animation:spl-up .6s .2s both}
    #splash span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#8C827A;animation:spl-up .6s .3s both}
    @keyframes spl-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes spl-climb{0%{stroke-dashoffset:1;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .t{stroke-dashoffset:0}}
  </style>
  <!-- the launch page (countdown) uses these three; the app switches to css/app.css when it starts (js/theme.js) -->
  <link rel="stylesheet" href="/css/styles.css" data-css="launch">
  <link rel="stylesheet" href="/css/ledger.css" data-css="launch">
  <link rel="stylesheet" href="/css/arcton.css" data-css="launch">
  <link rel="stylesheet" href="/css/launch.css" data-css="launch">
  <link rel="stylesheet" href="/css/app.css" data-css="app" media="not all">
  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/boot.js"></script>
</head>
<body>
  <div id="splash" role="presentation">
    <svg viewBox="0 0 180 120" aria-hidden="true"><path class="m" d="M0 120 L40 70 L58 82 L90 30 L108 52 L124 40 L180 120 Z"/><path class="t" pathLength="1" d="M10 116 C 30 100, 44 82, 58 80 S 82 52, 90 32"/><g class="p"><rect x="85" y="25" width="10" height="10" transform="rotate(45 90 30)"/></g></svg>
    <strong>Arcton Ai</strong>
    <span>Află ce te costă clienți</span>
  </div>
  <div id="app" class="app"></div>
  <div id="update-bar" class="update-bar" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root" hidden></div>
  <div id="chat-root" hidden></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Arcton Ai needs JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
