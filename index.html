<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arcton Ai</title>
  <meta name="description" content="Arcton Ai helps local businesses see what lies beneath: real reviews, a website that takes bookings and a clear next step every week.">
  <meta name="theme-color" content="#6D28D9">
  <!-- link previews (WhatsApp, Facebook, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Arcton Ai">
  <meta property="og:title" content="Arcton Ai · launching 30 November 2026">
  <meta property="og:description" content="Insights, a website that takes bookings and a design studio for local businesses. Count down with us.">
  <meta property="og:url" content="https://www.arcton.site/">
  <meta property="og:image" content="https://www.arcton.site/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arcton Ai">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Sora:wght@500;600;700&display=swap">
  <style>
    /* opening screen: inline so it paints before anything else loads */
    #splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(90% 70% at 10% 0%,#F472B6 0%,transparent 55%),radial-gradient(90% 70% at 100% 10%,#38BDF8 0%,transparent 55%),linear-gradient(140deg,#7C3AED 0%,#4F46E5 55%,#0EA5E9 120%);color:#F8F6FD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:Lexend,system-ui,sans-serif;transition:opacity .35s ease,visibility .35s}
    #splash.gone{opacity:0;visibility:hidden}
    #splash img{width:104px;height:104px;border-radius:28px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);animation:spl-in .7s cubic-bezier(.2,.8,.2,1) both}
    #splash strong{font-family:Sora,Lexend,system-ui,sans-serif;font-size:1.75rem;font-weight:600;letter-spacing:-.03em;margin-top:8px;animation:spl-up .6s .2s both}
    #splash span{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75;animation:spl-up .6s .3s both}
    #splash i{display:block;width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:22px;overflow:hidden;position:relative}
    #splash i::after{content:"";position:absolute;inset:0;width:40%;background:#fff;border-radius:3px;animation:spl-bar 1.1s ease-in-out infinite}
    @keyframes spl-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
    @keyframes spl-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes spl-bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
  </style>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/ledger.css">
  <link rel="stylesheet" href="/css/arcton.css">
  <script src="/js/boot.js"></script>
</head>
<body>
  <div id="splash" role="presentation">
    <img src="/icons/logo.svg" alt="" width="104" height="104">
    <strong>Arcton Ai</strong>
    <span>See what lies beneath</span>
    <i></i>
  </div>
  <div id="app" class="app"></div>
  <div id="update-bar" class="update-bar" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root" hidden></div>
  <div id="chat-root" hidden></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Arcton Ai needs JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
